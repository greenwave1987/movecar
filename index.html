<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#0093E9" />
  <title>MoveCar 模拟测试页（GitHub Pages）</title>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #0093E9 0%, #80D0C7 100%);
      min-height: 100vh;
      padding: calc(16px + var(--sat)) calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 顶部模拟控制台切换栏 */
    .sim-bar {
      width: 100%;
      max-width: 520px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      color: #f8fafc;
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    .sim-tabs { display: flex; gap: 6px; }
    .sim-tab {
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .sim-tab.active {
      background: #0093E9;
      border-color: #38bdf8;
      color: #fff;
    }
    .sim-actions { display: flex; gap: 6px; }
    .sim-mini-btn {
      border: none;
      background: rgba(255,255,255,0.14);
      color: #f1f5f9;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .sim-mini-btn:hover { background: rgba(255,255,255,0.24); }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 36px rgba(0, 147, 233, 0.2);
    }
    .header { text-align: center; background: #fff; }
    .icon-wrap {
      width: 76px; height: 76px;
      background: linear-gradient(135deg, #0093E9 0%, #80D0C7 100%);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 10px 24px rgba(0, 147, 233, 0.3);
      font-size: 38px;
    }
    .header h1 { font-size: 24px; color: #1e293b; margin-bottom: 4px; }
    .header p { font-size: 13px; color: #64748b; }

    .input-card { padding: 0; overflow: hidden; }
    .input-card textarea {
      width: 100%; min-height: 92px; border: none; padding: 18px;
      font-size: 16px; font-family: inherit; resize: none; outline: none; color: #1e293b;
      background: transparent;
    }
    .photo-upload-wrap {
      padding: 0 18px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .photo-btn {
      background: #e0f2fe; color: #0369a1; border: 1px dashed #38bdf8;
      padding: 9px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #photoInput { display: none; }
    .photo-preview-text { font-size: 12px; font-weight: 600; color: #e11d48; }

    .tags {
      display: flex; gap: 8px; padding: 0 16px 16px; overflow-x: auto; scrollbar-width: none;
    }
    .tags::-webkit-scrollbar { display: none; }
    .tag {
      background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
      color: #00796b; padding: 8px 14px; border-radius: 18px; font-size: 13px; font-weight: 600;
      white-space: nowrap; cursor: pointer; border: 1px solid #80cbc4;
    }

    .btn-main {
      background: linear-gradient(135deg, #0093E9 0%, #80D0C7 100%);
      color: #fff; border: none; padding: 16px; border-radius: 18px;
      font-size: 18px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 10px 26px rgba(0, 147, 233, 0.32);
    }
    .btn-main:disabled { opacity: 0.65; cursor: not-allowed; }

    .history-card { background: rgba(255,255,255,0.96); border-radius: 20px; padding: 18px; }
    .history-card h3 {
      font-size: 15px; color: #1e293b; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: #f8fafc; border-radius: 12px; padding: 10px 12px; font-size: 13px;
      border-left: 3px solid #0093E9; display: flex; gap: 10px; align-items: center;
    }
    .history-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #e2e8f0; flex-shrink: 0; }
    .history-info { flex: 1; min-width: 0; }
    .history-time { color: #64748b; font-size: 11px; margin-bottom: 2px; }
    .history-msg { color: #334155; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-reply { color: #0284c7; font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-empty { text-align: center; color: #94a3b8; font-size: 13px; padding: 10px 0; }

    .load-more-btn {
      width: 100%; margin-top: 10px; padding: 9px; border-radius: 10px;
      background: #f1f5f9; color: #0284c7; border: 1px dashed #38bdf8;
      font-size: 12px; font-weight: 600; cursor: pointer; display: none;
      align-items: center; justify-content: center;
    }

    #successView { display: none; }
    .success-card {
      text-align: center; background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      border: 2px solid #28a745;
    }
    .success-icon { font-size: 64px; display: block; margin-bottom: 10px; }
    .success-card h2 { color: #155724; font-size: 24px; margin-bottom: 6px; }
    .success-card p { color: #1e7e34; font-size: 14px; }

    .owner-card { background: #fff; border: 2px solid #80D0C7; text-align: center; }
    .owner-card.hidden { display: none; }
    .owner-card h3 { color: #0093E9; font-size: 22px; margin-bottom: 6px; }
    .owner-card p { color: #475569; font-size: 15px; }

    .action-card { display: flex; flex-direction: column; gap: 10px; }
    .action-hint { text-align: center; font-size: 13px; color: #64748b; display: none; }
    .action-hint.show { display: block; }
    .btn-retry, .btn-phone, .btn-back {
      color: #fff; border: none; padding: 13px; border-radius: 14px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    }
    .btn-retry { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .btn-phone { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); display: none; }
    .btn-phone.show { display: flex; }
    .btn-back { background: #64748b; font-size: 13px; padding: 10px; }

    /* 车主端视图 */
    #ownerView { display: none; }
    .owner-main-card {
      background: rgba(255,255,255,0.96); padding: 22px; border-radius: 26px;
      text-align: center; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.25);
    }
    .section-title {
      font-size: 13px; font-weight: 700; color: #475569; text-align: left;
      margin-bottom: 8px; display: flex; justify-content: space-between;
    }
    .record-selector { display: flex; flex-direction: column; gap: 8px; text-align: left; }
    .rec-item {
      background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px;
      padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 10px;
    }
    .rec-item.selected { background: #eef2ff; border-color: #6366f1; }
    .rec-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #e2e8f0; flex-shrink: 0; }
    .rec-meta { flex: 1; min-width: 0; }
    .rec-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 2px; }
    .rec-time { color: #64748b; font-weight: 600; }
    .rec-badge { font-size: 11px; padding: 1px 6px; border-radius: 6px; font-weight: 600; }
    .badge-wait { background: #fef3c7; color: #b45309; }
    .badge-done { background: #d1fae5; color: #065f46; }
    .rec-msg { font-size: 13px; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .message-box {
      background: #f8fafc; border-radius: 12px; padding: 12px; margin: 10px 0 12px;
      text-align: left; font-size: 14px; color: #334155; border-left: 4px solid #6366f1;
    }
    .photo-container { margin-bottom: 14px; border-radius: 12px; overflow: hidden; display: none; border: 1px solid #e2e8f0; }
    .photo-container.show { display: block; }
    .photo-container img { width: 100%; max-height: 210px; object-fit: cover; display: block; }

    .quick-replies { display: flex; gap: 8px; margin-bottom: 14px; }
    .qr-btn {
      flex: 1; padding: 10px 4px; border-radius: 12px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1px solid #cbd5e1; background: #f8fafc; color: #334155;
    }
    .qr-btn.active { background: #e0e7ff; border-color: #6366f1; color: #4f46e5; }

    .btn-confirm {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff; border: none; width: 100%; padding: 15px; border-radius: 16px;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .done-msg {
      background: #d1fae5; border-radius: 14px; padding: 12px; margin-top: 12px; display: none;
      color: #065f46; font-size: 13px; font-weight: 600;
    }
    .done-msg.show { display: block; }

    .toast {
      position: fixed; top: calc(16px + var(--sat)); left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #fff; color: #0f172a; padding: 10px 18px; border-radius: 14px;
      font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      opacity: 0; transition: all 0.3s ease; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading-text { animation: pulse 1.5s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- 模拟控制台栏 -->
  <div class="sim-bar">
    <div class="sim-tabs">
      <button id="tabUser" class="sim-tab active" onclick="switchView('user')">📱 申请端</button>
      <button id="tabOwner" class="sim-tab" onclick="switchView('owner')">🚘 车主确认端</button>
    </div>
    <div class="sim-actions">
      <button class="sim-mini-btn" onclick="seedSampleRecords()">+ 造3条测试数据</button>
      <button class="sim-mini-btn" onclick="clearAllRecords()">清空记录</button>
    </div>
  </div>

  <!-- 申请端视图 -->
  <div class="container" id="userView">
    <div id="mainView" class="container">
      <div class="card header">
        <div class="icon-wrap"><span>🚗</span></div>
        <h1>呼叫车主挪车（模拟）</h1>
        <p>GitHub Pages Local Simulation</p>
      </div>

      <div class="card input-card">
        <textarea id="msgInput" placeholder="输入留言给车主...（可选）"></textarea>
        <div class="photo-upload-wrap">
          <button type="button" class="photo-btn" onclick="document.getElementById('photoInput').click()">
            📷 拍摄/上传现场照片 *
          </button>
          <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoSelect(this)" />
          <span id="photoFileName" class="photo-preview-text">⚠️ 必须上传照片</span>
        </div>
        <div class="tags">
          <div class="tag" onclick="addTag('您的车挡住我了')">🚧 挡路</div>
          <div class="tag" onclick="addTag('临时停靠一下')">⏱️ 临停</div>
          <div class="tag" onclick="addTag('电话打不通')">📞 没接</div>
          <div class="tag" onclick="addTag('麻烦尽快')">🙏 加急</div>
        </div>
      </div>

      <button id="notifyBtn" class="card btn-main" onclick="sendNotify()">
        <span>🔔</span>
        <span>一键通知车主</span>
      </button>

      <div class="history-card">
        <h3>
          <span>📋 今日挪车记录</span>
          <span id="historyCount" style="font-size:12px; font-weight:normal; color:#64748b;"></span>
        </h3>
        <div id="historyList" class="history-list"></div>
        <button id="loadMoreBtn" class="load-more-btn" onclick="loadMoreUserRecords()">
          🔽 查看更多记录 (每次3条)
        </button>
      </div>
    </div>

    <div id="successView" class="container">
      <div id="waitingCard" class="card success-card">
        <span class="success-icon">⏳</span>
        <h2>通知已发送！</h2>
        <p class="loading-text">正在等待车主回应（可切到上方“车主确认端”模拟回复）...</p>
      </div>

      <div id="ownerFeedback" class="card owner-card hidden">
        <span id="replyEmoji" style="font-size:54px; display:block; margin-bottom:8px">🏃‍♂️</span>
        <h3 id="replyTitle">车主正飞奔赶来</h3>
        <p id="ownerReplyText" style="margin-top:6px;"></p>
      </div>

      <div class="card action-card">
        <p id="actionHint" class="action-hint">车主没反应？试试其他方式</p>
        <button id="retryBtn" class="btn-retry" onclick="handleRetryClick()">
          <span>🔔</span>
          <span>再次通知</span>
        </button>
        <a id="phoneBtn" href="tel:13800138000" class="btn-phone" onclick="showToast('模拟拨打车主电话: 13800138000'); return false;">
          <span>📞</span>
          <span>直接打电话</span>
        </a>
        <button class="btn-back" onclick="backToMain()">← 返回申请主页</button>
      </div>
    </div>
  </div>

  <!-- 车主确认端视图 -->
  <div class="container" id="ownerView">
    <div class="owner-main-card">
      <div style="font-size:42px; margin-bottom:6px;">🚗</div>
      <h1 style="font-size:21px; color:#1e293b;">挪车确认与回复（模拟）</h1>
      <p style="font-size:12px; color:#64748b; margin-bottom:14px;">选择当日申请记录并发送回复</p>

      <div class="section-title">
        <span>📋 当日申请记录（点击选择）</span>
        <span id="ownerRecCount">0 条</span>
      </div>
      <div id="ownerRecordSelector" class="record-selector"></div>
      <button id="ownerLoadMoreBtn" class="load-more-btn" style="color:#4f46e5; border-color:#a5b4fc;" onclick="loadMoreOwnerRecords()">
        🔽 查看更多申请 (每次3条)
      </button>

      <div id="ownerDetailPanel">
        <div class="message-box">
          💬 <b>当前选中留言：</b><span id="ownerMsgText">无</span>
        </div>
        <div id="ownerPhotoBox" class="photo-container">
          <img id="ownerScenePhoto" src="" alt="现场照片" />
        </div>
        <div class="quick-replies">
          <button type="button" class="qr-btn active" onclick="setReply(this, '抱歉挡了您的道，车主正飞奔而来，请稍后！')">🏃 马上</button>
          <button type="button" class="qr-btn" onclick="setReply(this, '你拍的照片看不清我挡了您的道，请换个角度再拍一张！')">📷 重拍</button>
          <button type="button" class="qr-btn" onclick="setReply(this, '我确定没挡您的道，不要联系我，另寻他法，抱歉！')">❌ 拒绝</button>
        </div>
        <button id="confirmBtn" class="btn-confirm" onclick="confirmOwnerReply()">
          🚀 对选中申请发送回复
        </button>
        <div id="ownerDoneMsg" class="done-msg"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'movecar_sim_records_v1';
    const DEFAULT_SVG_PHOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
        <rect width="240" height="160" fill="#e0f2fe"/>
        <text x="120" y="75" font-size="36" text-anchor="middle">🚙</text>
        <text x="120" y="110" font-size="13" fill="#0369a1" text-anchor="middle">模拟现场照片</text>
      </svg>`
    );

    let records = [];
    let selectedPhotoDataUrl = null;
    let selectedPhotoName = '';
    let retryCount = 0;
    let userLimit = 3;
    let ownerLimit = 3;
    let selectedRecordId = null;
    let selectedReply = '抱歉挡了您的道，车主正飞奔而来，请稍后！';
    let currentNotifyRecordId = null;

    window.onload = () => {
      loadFromStorage();
      renderAll();
    };

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        records = raw ? JSON.parse(raw) : [];
      } catch (e) {
        records = [];
      }
      if (records.length > 0 && !selectedRecordId) {
        selectedRecordId = records[0].id;
      }
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function switchView(mode) {
      document.getElementById('tabUser').classList.toggle('active', mode === 'user');
      document.getElementById('tabOwner').classList.toggle('active', mode === 'owner');
      document.getElementById('userView').style.display = mode === 'user' ? 'flex' : 'none';
      document.getElementById('ownerView').style.display = mode === 'owner' ? 'flex' : 'none';
      renderAll();
    }

    function handlePhotoSelect(input) {
      const el = document.getElementById('photoFileName');
      if (input.files && input.files[0]) {
        const file = input.files[0];
        selectedPhotoName = file.name;
        const reader = new FileReader();
        reader.onload = (e) => {
          selectedPhotoDataUrl = e.target.result;
          el.innerText = selectedPhotoName;
          el.style.color = '#059669';
        };
        reader.readAsDataURL(file);
      } else {
        selectedPhotoDataUrl = null;
        selectedPhotoName = '';
        el.innerText = '⚠️ 必须上传照片';
        el.style.color = '#e11d48';
      }
    }

    function addTag(text) {
      document.getElementById('msgInput').value = text;
    }

    function nowTimeStr() {
      return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function sendNotify() {
      if (!selectedPhotoDataUrl) {
        showToast('❌ 请先拍摄或选择现场照片（或点上方造测试数据）');
        return;
      }
      const msg = document.getElementById('msgInput').value.trim() || '车旁有人等待';
      const id = 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const item = {
        id,
        time: nowTimeStr(),
        message: msg,
        photo: selectedPhotoDataUrl,
        status: 'waiting',
        reply: '等待车主回应...'
      };
      records.unshift(item);
      selectedRecordId = id;
      currentNotifyRecordId = id;
      saveToStorage();
      renderAll();

      document.getElementById('mainView').style.display = 'none';
      document.getElementById('successView').style.display = 'flex';
      document.getElementById('waitingCard').style.display = 'block';
      document.getElementById('ownerFeedback').classList.add('hidden');
      showToast('✅ 模拟通知已发送！');
    }

    function handleRetryClick() {
      retryCount++;
      if (retryCount >= 3) {
        document.getElementById('actionHint').classList.add('show');
        document.getElementById('phoneBtn').classList.add('show');
        showToast('📞 已解锁直接打电话选项');
      } else {
        showToast(`🔔 已再次通知 (${retryCount}/3)`);
      }
      if (currentNotifyRecordId) {
        const target = records.find(r => r.id === currentNotifyRecordId);
        if (target) {
          target.time = nowTimeStr();
          saveToStorage();
          renderUserHistory();
        }
      }
    }

    function backToMain() {
      document.getElementById('successView').style.display = 'none';
      document.getElementById('mainView').style.display = 'flex';
      renderAll();
    }

    function renderAll() {
      renderUserHistory();
      renderOwnerView();
      syncSuccessFeedbackIfConfirmed();
    }

    function syncSuccessFeedbackIfConfirmed() {
      if (!currentNotifyRecordId) return;
      const rec = records.find(r => r.id === currentNotifyRecordId);
      if (rec && rec.status === 'confirmed') {
        document.getElementById('waitingCard').style.display = 'none';
        document.getElementById('ownerReplyText').innerText = rec.reply;
        const emojiEl = document.getElementById('replyEmoji');
        const titleEl = document.getElementById('replyTitle');
        if (rec.reply.includes('飞奔而来')) {
          emojiEl.innerText = '🏃‍♂️';
          titleEl.innerText = '车主正飞奔赶来';
        } else if (rec.reply.includes('换个角度')) {
          emojiEl.innerText = '📷';
          titleEl.innerText = '请重新拍摄现场照片';
        } else if (rec.reply.includes('没挡您的道')) {
          emojiEl.innerText = '🛑';
          titleEl.innerText = '车主反馈未挡道';
        }
        document.getElementById('ownerFeedback').classList.remove('hidden');
      }
    }

    function renderUserHistory() {
      const listEl = document.getElementById('historyList');
      const moreBtn = document.getElementById('loadMoreBtn');
      document.getElementById('historyCount').innerText = records.length ? `共 ${records.length} 条` : '';

      if (!records.length) {
        listEl.innerHTML = '<div class="history-empty">今日暂无挪车记录</div>';
        moreBtn.style.display = 'none';
        return;
      }

      const slice = records.slice(0, userLimit);
      listEl.innerHTML = slice.map(r => `
        <div class="history-item">
          <img src="${r.photo}" class="history-thumb" alt="照片" />
          <div class="history-info">
            <div class="history-time">${r.time}</div>
            <div class="history-msg">💬 ${escapeHtml(r.message)}</div>
            <div class="history-reply">👉 ${escapeHtml(r.reply)}</div>
          </div>
        </div>
      `).join('');

      moreBtn.style.display = records.length > userLimit ? 'flex' : 'none';
    }

    function loadMoreUserRecords() {
      userLimit += 3;
      renderUserHistory();
    }

    function renderOwnerView() {
      const selectorEl = document.getElementById('ownerRecordSelector');
      const moreBtn = document.getElementById('ownerLoadMoreBtn');
      const detailPanel = document.getElementById('ownerDetailPanel');
      document.getElementById('ownerRecCount').innerText = records.length + ' 条';

      if (!records.length) {
        selectorEl.innerHTML = '<div class="history-empty">今日暂无挪车申请记录</div>';
        moreBtn.style.display = 'none';
        detailPanel.style.display = 'none';
        return;
      }

      detailPanel.style.display = 'block';
      if (!selectedRecordId || !records.some(r => r.id === selectedRecordId)) {
        selectedRecordId = records[0].id;
      }

      const slice = records.slice(0, ownerLimit);
      selectorEl.innerHTML = slice.map(r => {
        const isSel = r.id === selectedRecordId;
        const isDone = r.status === 'confirmed';
        return `
          <div class="rec-item ${isSel ? 'selected' : ''}" onclick="selectOwnerRecord('${r.id}')">
            <img src="${r.photo}" class="rec-thumb" alt="照片" />
            <div class="rec-meta">
              <div class="rec-top">
                <span class="rec-time">⏱️ ${r.time}</span>
                <span class="rec-badge ${isDone ? 'badge-done' : 'badge-wait'}">${isDone ? '已回复' : '待回复'}</span>
              </div>
              <div class="rec-msg">💬 ${escapeHtml(r.message)}</div>
            </div>
          </div>
        `;
      }).join('');

      moreBtn.style.display = records.length > ownerLimit ? 'flex' : 'none';

      const current = records.find(r => r.id === selectedRecordId);
      if (current) {
        document.getElementById('ownerMsgText').innerText = current.message;
        const photoBox = document.getElementById('ownerPhotoBox');
        const img = document.getElementById('ownerScenePhoto');
        if (current.photo) {
          img.src = current.photo;
          photoBox.classList.add('show');
        } else {
          photoBox.classList.remove('show');
        }
        const doneEl = document.getElementById('ownerDoneMsg');
        if (current.status === 'confirmed') {
          doneEl.innerText = '✅ 当前已回复：' + current.reply;
          doneEl.classList.add('show');
        } else {
          doneEl.classList.remove('show');
        }
      }
    }

    function loadMoreOwnerRecords() {
      ownerLimit += 3;
      renderOwnerView();
    }

    function selectOwnerRecord(id) {
      selectedRecordId = id;
      renderOwnerView();
    }

    function setReply(btn, text) {
      document.querySelectorAll('.qr-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedReply = text;
    }

    function confirmOwnerReply() {
      if (!selectedRecordId) return;
      const rec = records.find(r => r.id === selectedRecordId);
      if (!rec) return;
      rec.status = 'confirmed';
      rec.reply = selectedReply;
      saveToStorage();
      renderAll();
      showToast('✅ 已回复该条挪车申请');
    }

    function seedSampleRecords() {
      const samples = [
        { message: '您的车挡住我了，出库困难', reply: '抱歉挡了您的道，车主正飞奔而来，请稍后！', status: 'confirmed' },
        { message: '临时停靠一下', reply: '你拍的照片看不清我挡了您的道，请换个角度再拍一张！', status: 'confirmed' },
        { message: '麻烦尽快', reply: '等待车主回应...', status: 'waiting' },
        { message: '电话打不通', reply: '我确定没挡您的道，不要联系我，另寻他法，抱歉！', status: 'confirmed' }
      ];
      samples.forEach((s, idx) => {
        records.unshift({
          id: 'seed_' + Date.now() + '_' + idx,
          time: '14:2' + idx + ':00',
          message: s.message,
          photo: DEFAULT_SVG_PHOTO,
          status: s.status,
          reply: s.reply
        });
      });
      selectedRecordId = records[0].id;
      saveToStorage();
      renderAll();
      showToast('已生成 4 条模拟记录（可测试默认3条+加载更多）');
    }

    function clearAllRecords() {
      records = [];
      selectedRecordId = null;
      currentNotifyRecordId = null;
      retryCount = 0;
      userLimit = 3;
      ownerLimit = 3;
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('actionHint').classList.remove('show');
      document.getElementById('phoneBtn').classList.remove('show');
      renderAll();
      showToast('已清空模拟记录');
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.innerText = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
